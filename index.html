<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stimmungsradio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#2b3a55; --sky2:#14181f; --ink:#f4f1ec; --ink2:rgba(244,241,236,.72);
  --glass:rgba(255,255,255,.10); --line:rgba(255,255,255,.18); --accent:#f4f1ec;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(170deg,var(--sky1),var(--sky2) 85%) fixed;
  transition:background 1.2s;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
main{max-width:560px;margin:0 auto;min-height:100%;padding:28px 22px 40px;display:flex;flex-direction:column;gap:22px}
.meta{font-size:15px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 16px}
h1{font-size:clamp(40px,12vw,64px);line-height:1;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.sub{font-size:17px;color:var(--ink2);max-width:34ch;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#14181f;border-color:var(--ink)}
.now{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(8px)}
.now b{font-size:20px;font-weight:600}
.now small{color:var(--ink2);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.btn{font:inherit;font-weight:600;font-size:17px;border:0;border-radius:14px;padding:14px 20px;cursor:pointer;color:#14181f;background:var(--ink)}
button.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.btn.big{flex:1 1 100%;font-size:19px;padding:17px}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
input.q{font:inherit;font-size:16px;flex:1;min-width:0;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
input.q::placeholder{color:var(--ink2)}
.msg{font-size:15px;color:var(--ink2);min-height:1.4em}
.msg.err{color:#ffd0c8}
.hide{display:none!important}
.foot{margin-top:auto;font-size:13px;color:var(--ink2)}
.foot a{color:inherit}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<main>
  <!-- Anmeldung -->
  <section id="login" class="hide" style="display:flex;flex-direction:column;gap:18px;margin-top:12vh">
    <h1>Musik, die zum Moment passt.</h1>
    <p class="sub">Verbinde dein Spotify Premium. Die App wählt Playlists nach Wetter, Tageszeit und Jahreszeit.</p>
    <button class="btn big" id="btnLogin">Mit Spotify verbinden</button>
    <p class="msg err" id="cfgMsg"></p>
  </section>

  <!-- Haupt-Ansicht -->
  <section id="app" class="hide" style="display:flex;flex-direction:column;gap:22px">
    <div class="meta"><span id="mWhere">Standort wird gesucht …</span><span id="mTemp"></span><span id="mClock"></span></div>
    <div>
      <h1 id="title">…</h1>
      <p class="sub" id="sub"></p>
    </div>

    <div class="chips" id="chips" role="group" aria-label="Wetter wählen"></div>

    <div class="now">
      <div><small>Vorschlag</small><br><b id="plName">–</b></div>
      <div class="row">
        <button class="btn big" id="btnPlay">Abspielen</button>
        <button class="btn ghost" id="btnOther">Andere Playlist</button>
        <button class="btn ghost" id="btnPause" aria-label="Pause">Pause</button>
        <button class="btn ghost" id="btnNext" aria-label="Nächster Titel">Weiter</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="row">
      <input class="q" id="custom" placeholder="Eigene Suche, z. B. Bossa Nova" enterkeyhint="search">
      <button class="btn ghost" id="btnCustom">Suchen</button>
    </div>
  </section>

  <p class="foot"><a href="#" id="logout" class="hide">Abmelden</a></p>
</main>

<script>
// ====== HIER DEINE CLIENT-ID VON developer.spotify.com EINTRAGEN ======
const CLIENT_ID = '85cc4bedbc1e43219fe1f285a3c7299a';
// ======================================================================

const REDIRECT = location.origin + location.pathname;
const SCOPES = 'user-read-playback-state user-modify-playback-state';
const $ = id => document.getElementById(id);
const LS = {
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- Spotify-Anmeldung (PKCE, kein Server nötig) ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const v = b64(crypto.getRandomValues(new Uint8Array(48)));
  LS.set('verifier', v);
  const ch = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  const p = new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:'S256',code_challenge:ch});
  location.href = 'https://accounts.spotify.com/authorize?' + p;
}
async function tokenCall(params){
  const r = await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,...params})});
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.error);
  LS.set('access', d.access_token);
  LS.set('expires', String(Date.now() + d.expires_in*1000 - 60000));
  if(d.refresh_token) LS.set('refresh', d.refresh_token);
}
async function token(){
  if(Date.now() < Number(LS.get('expires')||0)) return LS.get('access');
  const rt = LS.get('refresh'); if(!rt) return null;
  try{ await tokenCall({grant_type:'refresh_token',refresh_token:rt}); return LS.get('access'); }
  catch(e){ return null; }
}
async function api(path, opt={}){
  const t = await token();
  if(!t){ showLogin(); throw new Error('Bitte neu anmelden.'); }
  const r = await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}});
  if(r.status===204) return null;
  const d = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(d?.error?.message || ('Fehler '+r.status));
  return d;
}

/* ---------- Stimmung aus Ort, Zeit, Wetter ---------- */
const W = {
  clear:{adj:'Sonnig',  q:['sunny feel good','happy sunshine'], c:['#f2a65a','#5b4a8a']},
  cloud:{adj:'Bewölkt', q:['chill indie','cloudy day'],         c:['#6b7a90','#242b38']},
  rain: {adj:'Regnerisch',q:['rainy day lofi','rain jazz'],     c:['#3f5878','#161c28']},
  snow: {adj:'Verschneit',q:['snowy cozy','winter acoustic'],   c:['#8fa8c4','#2c3a52']},
  fog:  {adj:'Neblig',  q:['foggy ambient','atmospheric chill'],c:['#7d8590','#2a2f38']},
  storm:{adj:'Stürmisch',q:['stormy dark','epic cinematic'],    c:['#4a3f6b','#14111f']}
};
const WLABEL = {clear:'Sonne',cloud:'Wolken',rain:'Regen',snow:'Schnee',fog:'Nebel',storm:'Gewitter'};
const T = {morning:['Morgen','morning',false],day:['Nachmittag','afternoon',false],evening:['Abend','evening',false],night:['Nacht','night',true]};
const S = {spring:['Frühling','spring'],summer:['Sommer','summer'],autumn:['Herbst','autumn'],winter:['Winter','winter']};

function wmo(c){
  if(c<=1) return 'clear'; if(c<=3) return 'cloud'; if(c<=48) return 'fog';
  if(c<=67) return 'rain'; if(c<=77) return 'snow'; if(c<=82) return 'rain';
  if(c<=86) return 'snow'; return 'storm';
}
function timeOfDay(h){ return h>=5&&h<11?'morning': h>=11&&h<17?'day': h>=17&&h<22?'evening':'night'; }
function season(lat){
  let m = new Date().getMonth(); if(lat<0) m=(m+6)%12;
  return m>=2&&m<=4?'spring': m>=5&&m<=7?'summer': m>=8&&m<=10?'autumn':'winter';
}

let state = {lat:50.11, lon:8.68, where:'Frankfurt (Standard)', wx:'cloud', auto:true, temp:null, results:[], idx:0, queryUsed:''};

function mood(){
  const t = timeOfDay(new Date().getHours()), s = season(state.lat), w = W[state.wx];
  const [tNoun,tEn,fem] = T[t], [sNoun,sEn] = S[s];
  const title = w.adj + (fem?'e ':'er ') + sNoun + tNoun.toLowerCase();
  return {t,s,w,title,tEn,sEn, queries:[...w.q.map(q=>q+' '+tEn+' '+sEn), ...w.q.map(q=>q+' '+tEn), ...w.q]};
}

function paint(){
  const m = mood(), dark = m.t==='night'||m.t==='evening';
  const [a,b] = m.w.c;
  const r = document.documentElement.style;
  r.setProperty('--sky1', m.t==='night' ? '#1b2238' : a);
  r.setProperty('--sky2', dark ? '#0d1017' : b);
  $('title').textContent = m.title;
  $('sub').textContent = 'Passende Playlists zu ' + WLABEL[state.wx].toLowerCase() + ', ' + T[m.t][0].toLowerCase() + ' und ' + S[m.s][0].toLowerCase() + '.';
  $('mWhere').textContent = state.where;
  $('mTemp').textContent = state.temp!=null ? Math.round(state.temp)+' °C' : '';
  $('mClock').textContent = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', String((c.dataset.k==='auto')===state.auto && (state.auto || c.dataset.k===state.wx))));
}

function buildChips(){
  const box = $('chips');
  const mk = (k,l)=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=l;
    b.onclick=async()=>{ if(k==='auto'){state.auto=true;await loadWeather();} else {state.auto=false;state.wx=k;} paint(); await findPlaylists(); };
    box.appendChild(b);};
  mk('auto','Automatisch');
  Object.keys(WLABEL).forEach(k=>mk(k,WLABEL[k]));
}

/* ---------- Standort & Wetter (Open-Meteo, ohne Schlüssel) ---------- */
function getPos(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p=>res(p.coords),()=>res(null),{timeout:8000,maximumAge:600000});
  });
}
async function loadWeather(){
  const c = await getPos();
  if(c){ state.lat=c.latitude; state.lon=c.longitude; state.where='Dein Standort'; }
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${state.lat}&longitude=${state.lon}&current=temperature_2m,weather_code`);
    const d = await r.json();
    state.wx = wmo(d.current.weather_code); state.temp = d.current.temperature_2m;
  }catch(e){ $('msg').textContent='Wetter nicht abrufbar. Wähle es oben selbst aus.'; }
}

/* ---------- Playlists suchen und abspielen ---------- */
async function search(q){
  const d = await api('/search?type=playlist&limit=10&q='+encodeURIComponent(q));
  return (d.playlists?.items||[]).filter(Boolean);
}
async function findPlaylists(custom){
  const msg = $('msg'); msg.className='msg'; msg.textContent='Suche passende Playlists …';
  const list = custom ? [custom] : mood().queries;
  try{
    for(const q of list){
      const r = await search(q);
      if(r.length){ state.results = r.sort(()=>Math.random()-.5); state.idx=0; state.queryUsed=q; showPick(); msg.textContent=''; return; }
    }
    msg.className='msg err'; msg.textContent='Keine Playlist gefunden. Versuche eine eigene Suche.';
  }catch(e){ msg.className='msg err'; msg.textContent=e.message; }
}
function showPick(){ const p = state.results[state.idx]; $('plName').textContent = p ? p.name : '–'; }

async function play(){
  const msg = $('msg'), p = state.results[state.idx];
  if(!p){ msg.className='msg err'; msg.textContent='Noch keine Playlist ausgewählt.'; return; }
  try{
    const dv = (await api('/me/player/devices')).devices||[];
    if(!dv.length){ msg.className='msg err'; msg.textContent='Kein Gerät gefunden. Öffne die Spotify-App auf diesem oder einem anderen Gerät, spiele kurz einen Titel und tippe dann nochmal auf Abspielen.'; return; }
    const d = dv.find(x=>x.is_active) || dv[0];
    await api('/me/player/play?device_id='+d.id,{method:'PUT',body:JSON.stringify({context_uri:p.uri})});
    msg.className='msg'; msg.textContent='Läuft auf: '+d.name;
  }catch(e){ msg.className='msg err'; msg.textContent=e.message; }
}
async function ctl(path,method){
  try{ await api(path,{method}); }catch(e){ $('msg').className='msg err'; $('msg').textContent=e.message; }
}

/* ---------- Start ---------- */
function showLogin(){ $('app').classList.add('hide'); $('login').classList.remove('hide'); $('logout').classList.add('hide'); }
function showApp(){ $('login').classList.add('hide'); $('app').classList.remove('hide'); $('logout').classList.remove('hide'); }

async function init(){
  $('btnLogin').onclick = login;
  $('logout').onclick = e=>{e.preventDefault();['access','refresh','expires','verifier'].forEach(LS.del);showLogin();};
  $('btnPlay').onclick = play;
  $('btnOther').onclick = ()=>{ if(!state.results.length) return; state.idx=(state.idx+1)%state.results.length; showPick(); play(); };
  $('btnPause').onclick = ()=>ctl('/me/player/pause','PUT');
  $('btnNext').onclick = ()=>ctl('/me/player/next','POST');
  const run = ()=>{ const v=$('custom').value.trim(); if(v) findPlaylists(v); };
  $('btnCustom').onclick = run; $('custom').onkeydown = e=>{ if(e.key==='Enter') run(); };

  if(CLIENT_ID==='DEINE_CLIENT_ID'){ showLogin(); $('cfgMsg').textContent='Trage zuerst deine Client-ID im Code ein (Zeile "const CLIENT_ID").'; return; }

  const qs = new URLSearchParams(location.search);
  if(qs.get('code')){
    try{ await tokenCall({grant_type:'authorization_code',code:qs.get('code'),redirect_uri:REDIRECT,code_verifier:LS.get('verifier')}); }
    catch(e){ showLogin(); $('cfgMsg').textContent='Anmeldung fehlgeschlagen: '+e.message; return; }
    history.replaceState({},'',REDIRECT);
  }
  if(!(await token())){ showLogin(); return; }

  showApp(); buildChips(); paint();
  await loadWeather(); paint();
  await findPlaylists();
  setInterval(paint, 60000);
}
init();
</script>
</body>
</html>
